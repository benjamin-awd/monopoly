repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      # ruff exempts these comments, so match them directly
      - id: no-attribute-doc-comments
        name: use a plain "#" comment, not "#:"
        entry: '(^|\s)#:(\s|$)'
        language: pygrep
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        types: [python]
        args: [-n, auto]
