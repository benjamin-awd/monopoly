default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # run the ruff pinned in uv.lock, so pre-commit and CI can't drift apart
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # ruff's comment rules are preview-only and exempt "#:", so match directly.
      # Inline comments only check "#:", as a line regex can't tell "#" in a string.
      - id: comment-style
        name: start comments with "# "
        entry: '^\s*#(?![\s!]|$)|\s#:(\s|$)'
        language: pygrep
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        types: [python]
        args: [-n, auto]

  # release-please builds the changelog and picks the version bump from commit
  # subjects, so an unparseable subject silently drops out of the release notes.
  # Keep the type list and the rev in step with the CI job in ci.yaml.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, deps, revert, refactor, docs, style, chore, test, build, ci]
