repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      # ruff's comment rules are preview-only and exempt "#:", so match directly.
      # Inline comments only check "#:", as a line regex can't tell "#" in a string.
      - id: comment-style
        name: start comments with "# "
        entry: '^\s*#(?![\s!]|$)|\s#:(\s|$)'
        language: pygrep
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        types: [python]
        args: [-n, auto]
