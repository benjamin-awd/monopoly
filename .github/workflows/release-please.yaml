name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libpoppler-cpp-dev pkg-config ocrmypdf

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Build source and wheels
        run: uv build

      - name: Release to PyPI
        run: uv publish

      - name: Attach build artifacts to the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            LICENSE.md \
            dist/*monopoly*.whl \
            dist/*monopoly*.tar.gz

  # Tell monopoly-cloud to open a PR bumping monopoly-core to the version we
  # just published. Runs only after a successful publish, so the version is
  # already on PyPI when the downstream `uv add` runs.
  notify-cloud:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bump to monopoly-cloud
        env:
          # PAT (or GitHub App token) with permission to create dispatches on
          # benjamin-awd/monopoly-cloud (Contents: write). GITHUB_TOKEN cannot
          # reach another repository.
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          version="${version#v}"
          gh api --method POST repos/benjamin-awd/monopoly-cloud/dispatches \
            -f event_type=monopoly-core-release \
            -f "client_payload[version]=${version}"
