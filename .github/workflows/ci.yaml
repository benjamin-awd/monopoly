name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A bad subject is invisible once it is on main: release-please just drops the
  # commit from the notes. Check every commit a PR adds, since the repo keeps
  # them on rebase merge, so a PR-title check would miss all but the last one.
  # Keep the version and type list in step with .pre-commit-config.yaml.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          msg=$(mktemp)
          rc=0
          # --no-merges because a merge subject is not the author's to write
          for sha in $(git rev-list --no-merges --reverse "$base..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$msg"
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            uvx conventional-pre-commit@4.5.0 --strict --verbose \
              feat fix perf deps revert refactor docs style chore test build ci \
              "$msg" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pdftotext is an sdist-only C extension, so libpoppler-cpp-dev is needed to
      # build it. gcc/pkg-config are preinstalled on the runner; ocrmypdf is a
      # lazy, optional runtime dep that no lint/type/test job exercises.
      - name: Install pdftotext build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-cpp-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run CI
        run: |
          uv run task format-check
          uv run task lint
          uv run task mypy
          uvx pre-commit run comment-style --all-files
